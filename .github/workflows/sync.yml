name: Sync openvpn-as

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: sync-openvpn-as
  cancel-in-progress: false  # queue rather than cancel overlapping runs

permissions:
  contents: write   # to commit built-digests.json back
  packages: write   # to push to ghcr.io

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sync images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 << 'PYEOF'
          import json, os, re, subprocess, urllib.request

          SEMVER = re.compile(r'^\d+\.\d+\.\d+')

          # 1. Fetch all tags from Docker Hub (with pagination)
          tags = {}
          url = "https://hub.docker.com/v2/repositories/openvpn/openvpn-as/tags/?page_size=100"
          while url:
              with urllib.request.urlopen(url) as r:
                  data = json.loads(r.read())
              for item in data.get("results", []):
                  name, digest = item.get("name"), item.get("digest")
                  if name and digest:
                      tags[name] = digest
              url = data.get("next")

          # 2. Get latest digest and find matching versioned tag
          latest_digest = tags.get("latest")
          if not latest_digest:
              print("No 'latest' tag found, exiting.")
              exit(0)

          target_tag = next(
              (name for name, digest in tags.items()
               if SEMVER.match(name) and digest == latest_digest),
              None
          )
          if not target_tag:
              print(f"No versioned tag matches latest digest {latest_digest}")
              exit(0)

          print(f"Current latest: {target_tag} ({latest_digest})")

          # 3. Check if already built
          digests_file = ".github/built-digests.json"
          with open(digests_file) as f:
              built = json.load(f)

          if built.get(target_tag) == latest_digest:
              print(f"[skip] {target_tag} already built.")
              exit(0)

          # 4. Build and push
          owner = os.environ["OWNER"].lower()
          base_image = f"openvpn/openvpn-as:{target_tag}"
          target = f"ghcr.io/{owner}/openvpn-as:{target_tag}"
          print(f"\n[build] {target_tag}")

          ok = True
          for cmd in [
              ["docker", "pull", base_image],
              ["docker", "build",
               "--build-arg", f"BASE_IMAGE={base_image}",
               "-t", target, "."],
              ["docker", "push", target],
          ]:
              if subprocess.run(cmd).returncode != 0:
                  print(f"[ERROR] failed: {' '.join(cmd)}")
                  ok = False
                  break

          if ok:
              built[target_tag] = latest_digest
              with open(digests_file, "w") as f:
                  json.dump(built, f, indent=2, sort_keys=True)
                  f.write("\n")
              print(f"[ok] pushed {target}")
          PYEOF

      - name: Commit built-digests.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/built-digests.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update built-digests.json [skip ci]"
            git push origin main
          fi
